name: SBTS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: "pnpm"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release structure check
        run: pnpm release:check

      - name: Sprint contract checks
        run: |
          pnpm sprint2:verify
          pnpm sprint3:verify
          pnpm sprint4:verify
          pnpm sprint5:verify

      - name: TypeScript
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Production build
        run: pnpm build
