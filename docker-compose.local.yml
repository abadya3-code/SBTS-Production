services:
  mysql:
    image: mysql:8.4
    container_name: sbts-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sbts
      MYSQL_USER: sbts
      MYSQL_PASSWORD: sbts_local_password
      MYSQL_ROOT_PASSWORD: sbts_root_local_password
    ports:
      - "3307:3306"
    volumes:
      - sbts_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: sbts-minio-local
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sbts_minio_admin
      MINIO_ROOT_PASSWORD: sbts_minio_local_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sbts_minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 sbts_minio_admin sbts_minio_local_password; do sleep 2; done;
      mc mb --ignore-existing local/sbts;
      exit 0;
      "

volumes:
  sbts_mysql_data:
  sbts_minio_data:
